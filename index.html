<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clan-APP [TODN]</title>
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Clan-APP [TODN]","short_name":"TODN","start_url":"./index.html","display":"standalone","background_color":"#1a1a1a","theme_color":"#1a1a1a","orientation":"portrait-primary","icons":[{"src":"https://google.com","sizes":"512x512","type":"image/png"}]}'>

  <style>
    body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; margin: 0; }
    .btn { background-color: #007bff; color: white; border: none; padding: 14px 28px; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 85%; max-width: 300px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-decoration: none; display: inline-block; }
    .btn-green { background-color: #28a745; }
    .loader { border: 4px solid #333; border-top: 4px solid #007bff; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 30px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <script>
    const GOOGLE_SCRIPT_URL = "https://google.com";
  </script>

  <!-- Startbildschirm für bereits installierte Nutzer oder Fallbacks -->
  <div id="launch-screen" style="display: block;">
    <img src="https://google.com" style="width: 110px; height: 110px; border-radius: 20px; object-fit: cover;">
    <h2>Clan-APP [TODN]</h2>
    <div class="loader"></div>
    <p style="color: #aaa; padding: 0 20px;">Verbindung zum Kalender wird aufgebaut...</p>
    <!-- Sicherer, direkter Link-Button als Google-Fallback -->
    <a href="#" id="manual-open-btn" class="btn btn-green" style="display: none;" target="_blank">📅 Zum Kalender wechseln</a>
  </div>

  <!-- Installations-Bildschirm -->
  <div id="install-screen" style="display: none;">
    <img src="https://google.com" style="width: 110px; height: 110px; border-radius: 20px; object-fit: cover;">
    <h2>Clan-APP [TODN]</h2>
    <p style="color: #ccc; padding: 0 20px; font-size: 15px;">Installiere das Tool als App auf deinem Startbildschirm.</p>
    <button id="pwa-install-btn" class="btn">📲 App installieren</button>
    <br><br>
    <a href="#" id="skip-btn" style="color: #999; text-decoration: underline; font-size: 14px;">Ohne Installation starten</a>
  </div>

  <script>
    // 1. Service Worker registrieren
    if ('serviceWorker' in navigator) {
      const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));`;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: './' });
    }

    // 2. ID-Handling aus URL oder LocalStorage
    const urlParams = new URLSearchParams(window.location.search);
    let discordId = urlParams.get('id');
    if (discordId) {
      localStorage.setItem('clan_discord_id', discordId);
    } else {
      discordId = localStorage.getItem('clan_discord_id') || "";
    }

    const isApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    const finalUrl = GOOGLE_SCRIPT_URL + "?id=" + discordId;

    // Funktion zum Öffnen über target="_blank", damit Google nicht blockiert
    function openClanApp() {
      window.open(finalUrl, '_blank');
    }

    // Button-Fallback vorbereiten
    const manualBtn = document.getElementById('manual-open-btn');
    manualBtn.href = finalUrl;

    // Wenn es bereits die App ist: Zeige direkt den großen Start-Button
    if (isApp) {
      document.getElementById('launch-screen').querySelector('.loader').style.display = 'none';
      document.getElementById('launch-screen').querySelector('p').style.display = 'none';
      manualBtn.style.display = 'inline-block';
    }

    // 3. Installations-Prompt abfangen
    let deferredPrompt = null;
    let checked = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      if (!isApp) {
        checked = true;
        document.getElementById('launch-screen').style.display = 'none';
        document.getElementById('install-screen').style.display = 'block';
      }
    });

    // Fallback nach 2 Sekunden (falls keine Installation möglich ist)
    setTimeout(() => {
      if (!checked && !isApp) {
        document.getElementById('launch-screen').querySelector('.loader').style.display = 'none';
        manualBtn.style.display = 'inline-block';
        openClanApp();
      }
    }, 2000);

    // Klick auf Installieren
    document.getElementById('pwa-install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        deferredPrompt = null;
        document.getElementById('install-screen').style.display = 'none';
        document.getElementById('launch-screen').style.display = 'block';
        document.getElementById('launch-screen').querySelector('.loader').style.display = 'none';
        manualBtn.style.display = 'inline-block';
      }
    });

    // Klick auf Überspringen
    document.getElementById('skip-btn').addEventListener('click', (e) => {
      e.preventDefault();
      openClanApp();
    });
  </script>
</body>
</html>
